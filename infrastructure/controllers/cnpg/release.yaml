# CloudNativePG operator (#50). The Barman Cloud plugin is not installed: there
# is no backup target yet (see the not-planned backups issue).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1 # operator 1.30.1
      sourceRef:
        kind: HelmRepository
        name: cnpg
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
