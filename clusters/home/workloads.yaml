apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workloads-home
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: infra-configs
  path: ./workloads/home
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
