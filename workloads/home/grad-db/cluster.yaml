# Application database (#50), managed by CloudNativePG. The operator creates the
# Secret grad-db-app (key `uri`) that the api reads as DATABASE_URL.
#
# Bootstrapped on 2026-09-30 by importing `grad26` from the old postgres
# StatefulSet (pg_dump/pg_restore, Postgres 16 -> 17); bootstrap settings only
# apply at creation, so the import source has since been removed.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grad-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  # A PDB on the only instance would block draining the single node.
  enablePDB: false
  storage:
    size: 20Gi
    storageClass: local-path
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  bootstrap:
    initdb:
      database: grad
      owner: grad
