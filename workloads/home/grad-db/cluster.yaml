# Application database (#50), managed by CloudNativePG. The operator creates the
# Secret grad-db-app (key `uri`) that the api reads as DATABASE_URL.
#
# First start imports the existing `grad26` database from the old postgres
# StatefulSet (pg_dump/pg_restore, Postgres 16 -> 17). The import runs only at
# bootstrap; once the api has moved over, the old StatefulSet and the
# externalClusters entry are removed.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grad-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  # A PDB on the only instance would block draining the single node.
  enablePDB: false
  storage:
    size: 20Gi
    storageClass: local-path
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  bootstrap:
    initdb:
      database: grad
      owner: grad
      import:
        type: microservice
        databases:
          - grad26
        source:
          externalCluster: legacy-postgres
  externalClusters:
    - name: legacy-postgres
      connectionParameters:
        host: postgres
        user: grad
        dbname: grad26
        sslmode: disable
      password:
        name: postgres-credentials
        key: POSTGRES_PASSWORD
