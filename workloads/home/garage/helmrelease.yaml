# Garage object store (ADR-005): single node, replication factor 1, S3 API on a
# ClusterIP only. --single-node assigns the layout on first start; buckets and
# keys are created once by scripts/garage-bootstrap.sh.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
spec:
  interval: 1h
  chart:
    spec:
      chart: ./charts/garage
      # Upgrade only when Chart.yaml's version changes, not on every commit to the repo.
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    garage:
      singleNode: true
      # Keeps the rpc secret in git (SOPS) rather than generated by Helm.
      existingRpcSecret: garage-rpc
    image:
      # Multi-arch image, same tag as docker-compose.yml in the app repo.
      repository: dxflrs/garage
    persistence:
      meta: { storageClass: local-path, size: 5Gi }
      data: { storageClass: local-path, size: 200Gi }
    ingress:
      s3:
        api: { enabled: false }
        web: { enabled: false }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
    readinessProbe:
      httpGet: { path: /health, port: 3903 }
      initialDelaySeconds: 5
      periodSeconds: 15
