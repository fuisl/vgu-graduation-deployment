apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    stsSeconds: 31536000
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: no-referrer
    customResponseHeaders:
      # API responses are per-guest; no shared cache may store them.
      Cache-Control: no-store
      X-Powered-By: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
spec:
  rateLimit:
    average: 10
    period: 1s
    burst: 30
---
# /admin/* has no authentication in the API yet; refuse it until it does.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-all
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
