apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    stsSeconds: 31536000
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: no-referrer
    customResponseHeaders:
      # Cache-Control is the API's job: it defaults to no-store and marks only
      # shareable responses (derivatives, gallery, wishes, event info) cacheable.
      # Forcing it here overwrote those (fuisl/vgu-graduation#137).
      X-Powered-By: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
spec:
  rateLimit:
    average: 10
    period: 1s
    burst: 30
