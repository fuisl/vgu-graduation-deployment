apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels:
    app.kubernetes.io/name: api-service
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: vgu-graduation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-service
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: vgu-graduation
    spec:
      # Applies pending database migrations before the API starts. Idempotent, and
      # serialized by a Postgres advisory lock, so a rollout never races itself.
      # It loads the same production config, so it needs the same secrets.
      initContainers:
        - name: migrate
          image: fuisl/grad26-api:latest
          imagePullPolicy: Always
          command: ["node", "dist/migrate.js"]
          envFrom:
            - secretRef:
                name: api-secrets
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: NODE_ENV
              value: production
      containers:
        - name: api-service
          image: fuisl/grad26-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          # ADMIN_SESSION_SECRET, PASS_SIGNING_KEY, SERVICE_TOKEN_* and S3_* (SOPS-encrypted).
          envFrom:
            - secretRef:
                name: api-secrets
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: PORT
              value: "4000"
            - name: HOST
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: PUBLIC_ORIGIN
              value: https://grad26.fuisloy.dev
            - name: COOKIE_DOMAIN
              value: .grad26.fuisloy.dev
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
