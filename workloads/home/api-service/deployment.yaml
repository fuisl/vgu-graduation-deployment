apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels:
    app.kubernetes.io/name: api-service
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: vgu-graduation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-service
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: vgu-graduation
    spec:
      # Applies pending database migrations before the API starts. Idempotent, and
      # serialized by a Postgres advisory lock, so a rollout never races itself.
      # It loads the same production config, so it needs the same secrets.
      # Image tags are bumped by Flux image automation (clusters/home/image-automation.yaml)
      # through the "$imagepolicy" setter markers. main-<ts>-<sha> tags are immutable,
      # so IfNotPresent: a restart reuses the cached image instead of pulling.
      initContainers:
        - name: migrate
          image: docker.io/fuisl/grad26-api:main-20260930142908-88b2e05 # {"$imagepolicy": "flux-system:grad26-api"}
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/migrate.js"]
          envFrom:
            - secretRef:
                name: api-secrets
            - secretRef:
                name: api-s3
          env:
            # Created by CloudNativePG for the grad-db Cluster's application role.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: grad-db-app
                  key: uri
            - name: NODE_ENV
              value: production
      containers:
        - name: api-service
          image: docker.io/fuisl/grad26-api:main-20260930142908-88b2e05 # {"$imagepolicy": "flux-system:grad26-api"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          # ADMIN_SESSION_SECRET, PASS_SIGNING_KEY, SERVICE_TOKEN_* (api-secrets) and the
          # Garage S3_* endpoint and credentials (api-s3), both SOPS-encrypted.
          envFrom:
            - secretRef:
                name: api-secrets
            - secretRef:
                name: api-s3
          env:
            # Created by CloudNativePG for the grad-db Cluster's application role.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: grad-db-app
                  key: uri
            - name: PORT
              value: "4000"
            - name: HOST
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: PUBLIC_ORIGIN
              value: https://grad26.fuisloy.dev
            - name: COOKIE_DOMAIN
              value: .grad26.fuisloy.dev
            - name: S3_BUCKET_ORIGINALS
              value: grad-originals
            - name: S3_BUCKET_DERIVATIVES
              value: grad-derivatives
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
