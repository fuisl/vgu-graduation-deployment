apiVersion: batch/v1
kind: CronJob
metadata:
  name: ddns
  labels:
    app.kubernetes.io/name: ddns
    app.kubernetes.io/part-of: vgu-graduation
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ddns
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ddns
              image: docker.io/curlimages/curl:8.22.0
              command: ["/bin/sh", "/scripts/update.sh"]
              env:
                - name: DOMAIN
                  value: fuisloy.dev
                - name: RECORD_NAME
                  value: api.grad26
                - name: TTL
                  value: "300"
              envFrom:
                - secretRef:
                    name: spaceship-api
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: ddns-script
