# Background job runner: the api image started with the worker entrypoint. It polls
# the jobs table in Postgres (no broker) and talks to Garage; it serves no HTTP, so
# there are no probes and no Service. Migrations are run by the api's init container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: vgu-graduation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: vgu-graduation
    spec:
      # The worker finishes its current job within 25s of SIGTERM, then exits.
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        # The image's `grad` user (apps/api/Dockerfile); numeric so runAsNonRoot can verify it.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Bumped by Flux image automation; main-<ts>-<sha> tags are immutable.
          image: docker.io/fuisl/grad26-api:main-20261019095254-940b9e7 # {"$imagepolicy": "flux-system:grad26-api"}
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/worker.js"]
          # Same production config as the api: api-secrets and the Garage S3_* credentials
          # (api-s3), both SOPS-encrypted in workloads/home/api-service.
          envFrom:
            - secretRef:
                name: api-secrets
            - secretRef:
                name: api-s3
            # Guest email (ADR-012): the worker sends RSVP confirmations. Optional, like the api's.
            - secretRef:
                name: api-mail
                optional: true
          env:
            # Created by CloudNativePG for the grad-db Cluster's application role.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: grad-db-app
                  key: uri
            - name: NODE_ENV
              value: production
            - name: PUBLIC_ORIGIN
              value: https://grad26.fuisloy.dev
            # The API's public origin: the webcal:// feed link in calendar emails (ADR-012).
            - name: API_ORIGIN
              value: https://api.grad26.fuisloy.dev
            # Calendar RSVP by email (vgu-graduation ADR-013): the api sends invitations as
            # calendar invitations and the worker reads Yes/No replies over IMAP.
            - name: MAIL_CALENDAR_RSVP
              value: "true"
            - name: COOKIE_DOMAIN
              value: .grad26.fuisloy.dev
            - name: S3_BUCKET_ORIGINALS
              value: grad-originals
            - name: S3_BUCKET_DERIVATIVES
              value: grad-derivatives
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            # Scratch space for derivative generation; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
