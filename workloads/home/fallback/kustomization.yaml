apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: edge
resources:
  - network-policy.yaml
  - deployment.yaml
  - service.yaml
  - middleware.yaml
# The hash suffix rolls the pod whenever the page or the config changes.
configMapGenerator:
  - name: fallback-page
    files:
      - index.html
      - nginx.conf
