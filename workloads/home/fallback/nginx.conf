# Serves index.html for every path and nothing else. Runs as the image's
# non-root user with a read-only root filesystem: all writable paths are /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Request paths can carry invitation tokens; never log them.
  access_log off;
  server_tokens off;
  sendfile on;

  server {
    listen 8080 default_server;
    root /usr/share/nginx/html;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      default_type text/html;
      charset utf-8;
      try_files /index.html =404;
    }
  }
}
