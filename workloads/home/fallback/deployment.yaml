apiVersion: apps/v1
kind: Deployment
metadata:
  name: fallback
  labels:
    app.kubernetes.io/name: fallback
    app.kubernetes.io/part-of: vgu-graduation
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fallback
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fallback
        app.kubernetes.io/part-of: vgu-graduation
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e
          # Skip the image's entrypoint scripts; they try to rewrite config files.
          command: ["nginx", "-c", "/etc/nginx/fallback/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/fallback
              readOnly: true
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: fallback-page
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: page
          configMap:
            name: fallback-page
            items:
              - key: index.html
                path: index.html
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
